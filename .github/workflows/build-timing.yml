name: Build timing model

# Primary trigger: the Netlify 5-min logger commits raw poll files via PAT.
# Push triggers are reliable; the old every-5-min cron often never fired.
# A 30-min cron remains as a fallback so a missed push still gets processed.
on:
  push:
    paths:
      - 'data/20*.jsonl'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fallback poller: only on the cron path, in case the Netlify logger
      # is ever down. Never on push (Netlify just wrote the data).
      - name: Fallback poll (schedule only)
        if: github.event_name == 'schedule'
        run: python scripts/log_poll.py

      - name: Build endpoint events and timing model
        run: python scripts/build_timing.py

      - name: Commit timing outputs
        # The Netlify logger pushes every 5 min; a push that lands mid-build
        # makes a plain `git push` fail (non-fast-forward). Rebase onto the
        # new tip before pushing. Processing is watermark-idempotent, so a
        # rebased build never double-counts; the next triggered run catches
        # up any raw polls that arrived during the rebase window.
        # 2026-10-06: the rebase itself can CONFLICT when the logger appends
        # to the same data files mid-build (observed: segments.json +
        # events.jsonl). On conflict: abort, rebuild on the new tip
        # (idempotent), and retry the push. Three attempts, then fail loud.
        run: |
          git config user.name 'forge-line-logger'
          git config user.email 'forge-line-logger@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add data/
            if git diff --cached --quiet; then
              if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
                echo 'no new timing data to commit'
                exit 0
              fi
              # Unpushed commit from a raced push: rebase and retry below.
            else
              git commit -m 'timing build [skip ci]'
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase conflict (attempt $attempt): rebuilding on new tip"
              git rebase --abort
              git reset --hard origin/main
              python scripts/build_timing.py
              continue
            fi
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push raced (attempt $attempt); retrying"
          done
          echo 'failed to push after 3 attempts' >&2
          exit 1
